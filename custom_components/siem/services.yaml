label_incident:
  fields:
    label:
      required: true
      example: "false_alarm"
      selector:
        select:
          translation_key: label
          options:
            - false_alarm
            - thats_me
            - guest
            - real
    incident_id:
      required: false
      example: "3f9a1c2b"
      selector:
        text:
run_digest:
  fields:
    ai_task_entity:
      required: false
      selector:
        entity:
          domain: ai_task
    preview:
      required: false
      default: false
      selector:
        boolean:
reset_weights: {}
set_house_mode:
  fields:
    mode:
      required: true
      example: "auto"
      selector:
        select:
          translation_key: house_mode
          options:
            - auto
            - vacant
            - guest
            - service
            - family
            - night
