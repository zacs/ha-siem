# =============================================================================
# SIEM Security: test entities for a dry run
# =============================================================================
#
# A Home Assistant *package* that builds a fake house of "Test ..." entities so
# you can walk through the SIEM config flow and watch incidents score without
# touching a real device. A simulated household drives the sensors on its own;
# helpers named "(helper)" let you force anything by hand.
#
# INSTALL
#   1. Copy this file to <config>/packages/siem_test_entities.yaml
#   2. Enable packages in configuration.yaml if you have not already:
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Restart Home Assistant.
#   4. Create three areas: "Test Kitchen", "Test Living Room", "Test Backyard".
#      In Settings > Devices & services > Entities search "test kitchen",
#      select everything, and use "Move to area". Repeat for the other rooms.
#      Leave the whole-house entities (front door CSI, water flow, house load,
#      EV charger, front door lock, LCM event, persons, everything named
#      "Test Sim ...") without an area.
#   5. Add the SIEM integration. Suggested answers are further down this header.
#
# HOW THE SIMULATION WORKS
#   Every entity the SIEM watches is a template mirror driven by two things: a
#   helper you can flip by hand, and a simulated household that runs on its
#   own. With "Test Simulation (helper)" on, which it is after every restart,
#   each sensor rolls dice every two seconds. The chance of turning on depends
#   on the scene of the day, the state then holds for a realistic while (45 s
#   for motion, minutes for presence, twenty minutes for a window) and clears.
#   A helper that is on forces its mirror on regardless, so the walkthrough
#   below still works with the simulation running, just with extra noise.
#
#   Scenes come from the clock, or from "Test Sim Scene Override (helper)":
#     asleep    23:00-06:00           almost nothing moves; the odd fridge visit
#     morning   06:00-09:00           kitchen busy, coffee, showers, doors as
#                                     people leave
#     away      09:00-17:00 weekdays  house empty: rare motion, deliveries at the
#                                     gate and front door, a guest with a PIN most
#                                     afternoons (LCM PIN, guest mode), now and
#                                     then an unexplained 900 W load
#     day       09:00-17:00 weekends  people home and moving about
#     evening   17:00-23:00           everyone home, TV on, dinner, EV charging
#   Alice's and Bob's trackers follow the scene (home in every scene but away),
#   so the SIEM house mode follows too: vacant during away, family otherwise.
#   "Test Simulation Rate (helper)" scales every probability; 5 makes a quiet
#   afternoon eventful. The rates are expected events per hour:
#
#                              asleep  morning  away  day  evening   holds for
#     kitchen motion             0.3     15     0.15    6     10       45 s
#     kitchen presence           0.2      8     0.05    4      6      3 min
#     kitchen sound              0.5     10     0.5     5      8       20 s
#     kitchen Bayesian evidence  0.1      6     0.05    3      5       60 s
#     kitchen back door          0.02     1.5   0.05    1      1.5     30 s
#     kitchen window             0.02     0.2   0.02    0.3    0.2    20 min
#     fridge door                0.2      8     0.02    4      6       15 s
#     living room motion         0.2      4     0.1     5     12       45 s
#     living room camera person  0.1      2     0.05    3      6       30 s
#     front door                 0.02     2     0.1     1      2       30 s
#     living room window         0.02     0.2   0.02    0.3    0.2    20 min
#     backyard gate              0.02     0.3   0.3     0.8    0.5     20 s
#     backyard camera person     0.1      0.8   1.0     1.5    0.8     40 s
#     front door CSI             0.05     3     0.4     1.5    3       30 s
#     TV on                      0.02     1     0.02    0.5    2      90 min
#     coffee maker               0.01     3     0.01    0.6    0.3     4 min
#     water flow                 0.3      5     0.05    2      4       3 min
#     unexplained 900 W load     0.05     0.1   0.3     0.2    0.2    10 min
#     EV charging                0.3      0     0       0      0.5     2 h
#   The guest's visit lifts kitchen and living room motion for thirty minutes.
#   Two scripted scenarios play fixed sequences through the helpers:
#   script.test_sim_break_in (gate, camera, back door, motion, light, fridge)
#   and script.test_sim_delivery (gate, then motion at the front door only).
#
#   The mirrors are trigger-based templates on a time_pattern trigger on
#   purpose: a change made from the UI carries your user id, and SIEM never
#   counts anything a Home Assistant user did. Re-rendering on a timer drops
#   that context, so SIEM sees every change, simulated or forced, as
#   physical, exactly like a real contact or a wall switch. Setting a mirror's
#   state in Developer tools > States carries your user id instead, and SIEM
#   ignores it; the mirror snaps back within two seconds.
#
#   Because of that, leave packages/siem_deterrence.yaml out while this file
#   is loaded: the lights it turns on here are mirrors too, so they would look
#   like someone at the switch and score against themselves. Real lights keep
#   the automation's context and never do.
#
# THINGS THIS FILE CANNOT CREATE (set up by hand, most are optional)
#   - Areas: create the three areas above and move the entities into them.
#   - Notifications: nothing to set up. SIEM sends none itself; the automation
#     at the bottom of this file turns its siem_notification events into
#     persistent notifications, so alerts land in the notification drawer,
#     The sample packages in packages/ do the same for Mattermost and the
#     companion app.
#   - Calendar: add a Local Calendar (Settings > Devices & services > Add
#     integration) named "Test House Calendar" and create events titled
#     "Guest: Test Guest" or "Service: Plumber". Or set calendar state by hand in
#     Developer tools > States with attributes message, start_time, end_time.
#   - Camera: not templatable. Add a Generic Camera pointing at any still image
#     URL, or leave the room camera empty (snapshots are then skipped).
#   - AI task entity: comes from an LLM integration (OpenAI, Anthropic, Google,
#     Ollama). Leave it empty to see the digest fall back to raw counts.
#   - Label buttons on a phone: packages/siem_mobile_app.yaml needs the
#     companion app (notify.mobile_app_*).
#   - Lock Code Manager: event.test_lcm_guest_credential_used below imitates an
#     LCM per-user "credential used" event entity (code_slot, name, operation).
#     It fires from the guest's buttons and from the simulated afternoon visit.
#   - Z-Wave lock notifications: run the script.test_front_door_* scripts; they
#     fire zwave_js_notification events the SIEM listens to.
#   - Device trackers: the automation at the bottom keeps three legacy
#     trackers (device_tracker.see, stored in known_devices.yaml) in sync with
#     the "... home" helpers and the simulated scene.
#
# SUGGESTED CONFIG FLOW ANSWERS
#   Rooms: Test Kitchen, Test Living Room, Test Backyard. The room steps are
#     pre-filled from the areas; check the fridge door landed under interior
#     doors, the gate under perimeter openings, and that Test Backyard is
#     ticked as outdoors (its name does that).
#   Whole house: residents person.test_alice and person.test_bob; additional
#     tracker device_tracker.test_second_car; CSI binary_sensor.test_front_door_csi
#     mapped to binary_sensor.test_front_door; water sensor.test_water_flow with
#     threshold 1; load sensor.test_house_load with automated load
#     sensor.test_ev_charger_power, step 100 W, sustain 5 minutes; locks
#     lock.test_front_door_lock; LCM events event.test_lcm_guest_credential_used;
#     calendar your test calendar; a night window covering "now" if you want
#     to see the 1.5x exterior multiplier, and night mode while someone is
#     home. Leave the alarm panel empty: the rig has none, and without one the
#     night window is bedtime.
#   Digest: a digest time a few minutes ahead.
#
# WATCHING THE SIMULATION
#   Leave it running. Force the scene to "away" to see a vacant house: an
#   incident every couple of hours from a stray motion or a delivery, most of
#   them verify tier, and the guest's visit flipping the house to guest. Turn the
#   rate up to 5 to compress that into minutes. Force "evening" to see a full
#   house score nothing. Force "asleep" with a night window covering now to
#   see night mode: the odd fridge visit scores nothing, while a back door
#   that opens with nobody up first is a deter.
#
# WALKTHROUGH (simulation off, house mode vacant, night window off)
#   Turn "Test Simulation (helper)" off first, or the dice will add events to
#   the exact numbers below.
#   1. Turn on "Test Kitchen Back Door (helper)": score 40, tier verify, one
#      notification with the timeline.
#   2. Within five minutes turn on "Test Kitchen Motion (helper)": medium
#      source 30 points x 1.5 entry chain = 45, score 85, tier alarm, and a
#      minute later binary_sensor.siem_alarm_trigger turns on.
#   3. Turn on "Test Alice Phone Home (helper)": the arrival cancels what the
#      last ten minutes scored (at least 60), score 0, house mode family,
#      recommended alarm mode disarmed. Within the minute after step 2, the
#      alarm trigger never turns on: a resident whose phone was late.
#   4. Turn it off again, wait 30 minutes (or force vacant with
#      select.siem_house_mode_override), then run
#      script.test_front_door_manual_unlock: 60 points and a break-glass
#      alert.
#   5. Press "Test Guest Uses PIN (helper)": -40, house mode guest, incident
#      person Test Guest. The keypad scripts do the same: any code the lock
#      accepts lets someone in, whether Lock Code Manager knows it or not.
#   6. Turn off "Test Kitchen Motion Online (helper)": after two minutes,
#      sensor_offline 20; after 60 minutes vacant, a break-glass alert.
#   7. Label the incident with select.siem_label_last_incident. False alarm
#      and real move the weights (see them in the options flow); that's me and
#      guest are only recorded. Run siem.run_digest to send the digest.
#   8. Run script.test_sim_break_in for the whole sequence in one go.
# =============================================================================

input_boolean:
  # Simulation
  test_simulation:
    name: Test Simulation (helper)
    icon: mdi:dice-multiple
    initial: true
  # Test Kitchen
  test_kitchen_motion:
    name: Test Kitchen Motion (helper)
    icon: mdi:motion-sensor
  test_kitchen_motion_online:
    name: Test Kitchen Motion Online (helper)
    icon: mdi:lan-connect
    initial: true
  test_kitchen_presence:
    name: Test Kitchen Presence (helper)
    icon: mdi:radar
  test_kitchen_sound:
    name: Test Kitchen Sound (helper)
    icon: mdi:ear-hearing
  test_kitchen_bayesian_evidence:
    name: Test Kitchen Bayesian Evidence (helper)
    icon: mdi:chart-bell-curve
  test_kitchen_back_door:
    name: Test Kitchen Back Door (helper)
    icon: mdi:door
  test_kitchen_window:
    name: Test Kitchen Window (helper)
    icon: mdi:window-closed-variant
  test_kitchen_fridge_door:
    name: Test Kitchen Fridge Door (helper)
    icon: mdi:fridge
  test_kitchen_light:
    name: Test Kitchen Light (helper)
    icon: mdi:lightbulb
  # Test Living Room
  test_living_room_motion:
    name: Test Living Room Motion (helper)
    icon: mdi:motion-sensor
  test_living_room_camera_person:
    name: Test Living Room Camera Person (helper)
    icon: mdi:account-eye
  test_front_door:
    name: Test Front Door (helper)
    icon: mdi:door
  test_living_room_window:
    name: Test Living Room Window (helper)
    icon: mdi:window-closed-variant
  test_living_room_light:
    name: Test Living Room Light (helper)
    icon: mdi:lightbulb
  # Test Backyard
  test_backyard_gate:
    name: Test Backyard Gate (helper)
    icon: mdi:gate
  test_backyard_camera_person:
    name: Test Backyard Camera Person (helper)
    icon: mdi:account-eye
  # Whole house
  test_front_door_csi:
    name: Test Front Door CSI (helper)
    icon: mdi:wifi-strength-3
  test_front_door_locked:
    name: Test Front Door Locked (helper)
    icon: mdi:lock
    initial: true
  test_alice_phone_home:
    name: Test Alice Phone Home (helper)
    icon: mdi:cellphone
  test_bob_phone_home:
    name: Test Bob Phone Home (helper)
    icon: mdi:cellphone
  test_second_car_home:
    name: Test Second Car Home (helper)
    icon: mdi:car

input_number:
  test_simulation_rate:
    name: Test Simulation Rate (helper)
    min: 0.1
    max: 10
    step: 0.1
    initial: 1
    mode: slider
    icon: mdi:speedometer
  test_kitchen_light_brightness:
    name: Test Kitchen Light Brightness (helper)
    min: 0
    max: 255
    step: 1
    initial: 255
    icon: mdi:brightness-6
  test_kitchen_coffee_maker_power:
    name: Test Kitchen Coffee Maker Power (helper)
    min: 0
    max: 2000
    step: 10
    initial: 0
    unit_of_measurement: W
    icon: mdi:coffee-maker
  test_living_room_tv_power:
    name: Test Living Room TV Power (helper)
    min: 0
    max: 500
    step: 5
    initial: 0
    unit_of_measurement: W
    icon: mdi:television
  test_water_flow:
    name: Test Water Flow (helper)
    min: 0
    max: 30
    step: 0.5
    initial: 0
    unit_of_measurement: L/min
    icon: mdi:water-pump
  test_house_load:
    name: Test House Load (helper, base load)
    min: 0
    max: 5000
    step: 50
    initial: 300
    unit_of_measurement: W
    icon: mdi:home-lightning-bolt
  test_ev_charger_power:
    name: Test EV Charger Power (helper)
    min: 0
    max: 8000
    step: 100
    initial: 0
    unit_of_measurement: W
    icon: mdi:ev-station

input_select:
  test_sim_scene_override:
    name: Test Sim Scene Override (helper)
    options: [auto, asleep, morning, away, day, evening]
    initial: auto
    icon: mdi:theater

input_button:
  test_guest_uses_pin:
    name: Test Guest Uses PIN (helper)
    icon: mdi:dialpad
  test_guest_locks_up:
    name: Test Guest Locks Up (helper)
    icon: mdi:lock-check

template:
  # ---------------------------------------------------------------------------
  # The simulated household and the mirrors the SIEM watches. Everything here
  # re-renders every two seconds, so state changes carry no user context.
  #
  # Each mirror is "helper on" OR a two-state Markov chain: an off sensor turns
  # on with probability per_hour * rate * tick / 3600, an on sensor stays on
  # with probability 1 - tick / hold_seconds. The block variables below are
  # shared by every template in the block; scene and guest_here lag one tick.
  # ---------------------------------------------------------------------------
  - triggers:
      - trigger: time_pattern
        seconds: "/2"
    variables:
      tick: 2
      sim: "{{ is_state('input_boolean.test_simulation', 'on') }}"
      rate: "{{ states('input_number.test_simulation_rate') | float(1) }}"
      scene: "{{ states('sensor.test_sim_scene') }}"
      guest_here: "{{ is_state('binary_sensor.test_sim_guest_here', 'on') }}"
    sensor:
      - name: Test Sim Scene
        unique_id: siem_test_sim_scene
        icon: mdi:theater
        state: >-
          {% set override = states('input_select.test_sim_scene_override') %}
          {% set hour = now().hour %}
          {{ override if override != 'auto' else 'off' if not sim
             else 'asleep' if (hour < 6 or hour >= 23)
             else 'morning' if hour < 9
             else ('away' if now().weekday() < 5 else 'day') if hour < 17
             else 'evening' }}
      - name: Test Sim Fridge Load
        unique_id: siem_test_sim_fridge_load
        unit_of_measurement: W
        icon: mdi:fridge-outline
        state: >-
          {% set on = states(this.entity_id) | float(0) > 10 %}
          {{ 80 if sim and ((on and (range(10000) | random) >= 10000 * tick / 480)
                            or (not on and (range(10000) | random) < 10000 * tick / 720)) else 0 }}
      - name: Test Sim Mystery Load
        unique_id: siem_test_sim_mystery_load
        unit_of_measurement: W
        icon: mdi:radiator
        state: >-
          {% set per_hour = {'asleep': 0.05, 'morning': 0.1, 'away': 0.3, 'day': 0.2, 'evening': 0.2}.get(scene, 0) %}
          {% set on = states(this.entity_id) | float(0) > 10 %}
          {{ 900 if sim and ((on and (range(10000) | random) >= 10000 * tick / 600)
                             or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600)) else 0 }}
      - name: Test Kitchen Coffee Maker Power
        unique_id: siem_test_kitchen_coffee_maker_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: >-
          {% set per_hour = {'asleep': 0.01, 'morning': 3, 'away': 0.01, 'day': 0.6, 'evening': 0.3}.get(scene, 0) %}
          {% set on = states(this.entity_id) | float(0) > 100 %}
          {% set on = sim and ((on and (range(10000) | random) >= 10000 * tick / 240)
                               or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600)) %}
          {{ [states('input_number.test_kitchen_coffee_maker_power') | float(0), (1050 + (range(150) | random)) if on else (range(2) | random)] | max }}
      - name: Test Living Room TV Power
        unique_id: siem_test_living_room_tv_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: >-
          {% set per_hour = {'asleep': 0.02, 'morning': 1, 'away': 0.02, 'day': 0.5, 'evening': 2}.get(scene, 0) %}
          {% set on = states(this.entity_id) | float(0) > 30 %}
          {% set on = sim and ((on and (range(10000) | random) >= 10000 * tick / 5400)
                               or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600)) %}
          {{ [states('input_number.test_living_room_tv_power') | float(0), (95 + (range(40) | random)) if on else (1 + (range(3) | random))] | max }}
      - name: Test Water Flow
        unique_id: siem_test_water_flow
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: L/min
        state: >-
          {% set per_hour = {'asleep': 0.3, 'morning': 5, 'away': 0.05, 'day': 2, 'evening': 4}.get(scene, 0) %}
          {% set on = states(this.entity_id) | float(0) > 0.5 %}
          {% set on = sim and ((on and (range(10000) | random) >= 10000 * tick / 180)
                               or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600)) %}
          {{ [states('input_number.test_water_flow') | float(0), (3 + (range(60) | random) / 10) if on else 0] | max }}
      - name: Test EV Charger Power
        unique_id: siem_test_ev_charger_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: >-
          {% set per_hour = {'asleep': 0.3, 'evening': 0.5}.get(scene, 0) %}
          {% set on = states(this.entity_id) | float(0) > 100 %}
          {% set on = sim and ((on and (range(10000) | random) >= 10000 * tick / 7200)
                               or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600)) %}
          {{ [states('input_number.test_ev_charger_power') | float(0), (6800 + (range(400) | random)) if on else 0] | max }}
      # The base load helper plus everything the simulation switched on. The
      # SIEM subtracts the EV charger, so the fridge, TV, coffee maker and the
      # mystery load are what is left in the residual.
      - name: Test House Load
        unique_id: siem_test_house_load
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: >-
          {{ (states('input_number.test_house_load') | float(0)
              + states('sensor.test_sim_fridge_load') | float(0)
              + states('sensor.test_sim_mystery_load') | float(0)
              + states('sensor.test_kitchen_coffee_maker_power') | float(0)
              + states('sensor.test_living_room_tv_power') | float(0)
              + states('sensor.test_ev_charger_power') | float(0)) | round(0) }}
    binary_sensor:
      # A guest with a PIN: a one-tick pulse that fires the LCM event entity,
      # then thirty minutes of being around the house.
      - name: Test Sim Guest Visit
        unique_id: siem_test_sim_guest_visit
        icon: mdi:account-key
        state: "{{ sim and scene == 'away' and 13 <= now().hour < 16 and (range(100000) | random) < 100000 * 0.7 * rate * tick / 3600 }}"
      - name: Test Sim Guest Here
        unique_id: siem_test_sim_guest_here
        icon: mdi:account-key
        state: >-
          {{ sim and (is_state('binary_sensor.test_sim_guest_visit', 'on')
                      or (is_state(this.entity_id, 'on') and (range(10000) | random) >= 10000 * tick / 1800)) }}
      # Test Kitchen
      - name: Test Kitchen Motion
        unique_id: siem_test_kitchen_motion
        device_class: motion
        availability: >-
          {% set down = is_state(this.entity_id, 'unavailable') %}
          {{ is_state('input_boolean.test_kitchen_motion_online', 'on')
             and not (sim and ((down and (range(10000) | random) >= 10000 * tick / 120)
                               or (not down and (range(100000) | random) < 100000 * 0.05 * rate * tick / 3600))) }}
        state: >-
          {% set per_hour = {'asleep': 0.3, 'morning': 15, 'away': 0.15, 'day': 6, 'evening': 10}.get(scene, 0) + (20 if guest_here else 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_kitchen_motion', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 45)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Kitchen Presence
        unique_id: siem_test_kitchen_presence
        device_class: presence
        state: >-
          {% set per_hour = {'asleep': 0.2, 'morning': 8, 'away': 0.05, 'day': 4, 'evening': 6}.get(scene, 0) + (10 if guest_here else 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_kitchen_presence', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 180)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Kitchen Sound
        unique_id: siem_test_kitchen_sound
        device_class: sound
        state: >-
          {% set per_hour = {'asleep': 0.5, 'morning': 10, 'away': 0.5, 'day': 5, 'evening': 8}.get(scene, 0) + (10 if guest_here else 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_kitchen_sound', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 20)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Kitchen Bayesian Evidence
        unique_id: siem_test_kitchen_bayesian_evidence
        state: >-
          {% set per_hour = {'asleep': 0.1, 'morning': 6, 'away': 0.05, 'day': 3, 'evening': 5}.get(scene, 0) + (8 if guest_here else 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_kitchen_bayesian_evidence', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 60)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Kitchen Back Door
        unique_id: siem_test_kitchen_back_door
        device_class: door
        state: >-
          {% set per_hour = {'asleep': 0.02, 'morning': 1.5, 'away': 0.05, 'day': 1, 'evening': 1.5}.get(scene, 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_kitchen_back_door', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 30)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Kitchen Window
        unique_id: siem_test_kitchen_window
        device_class: window
        state: >-
          {% set per_hour = {'asleep': 0.02, 'morning': 0.2, 'away': 0.02, 'day': 0.3, 'evening': 0.2}.get(scene, 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_kitchen_window', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 1200)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Kitchen Fridge Door
        unique_id: siem_test_kitchen_fridge_door
        device_class: door
        state: >-
          {% set per_hour = {'asleep': 0.2, 'morning': 8, 'away': 0.02, 'day': 4, 'evening': 6}.get(scene, 0) + (3 if guest_here else 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_kitchen_fridge_door', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 15)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      # Test Living Room
      - name: Test Living Room Motion
        unique_id: siem_test_living_room_motion
        device_class: motion
        state: >-
          {% set per_hour = {'asleep': 0.2, 'morning': 4, 'away': 0.1, 'day': 5, 'evening': 12}.get(scene, 0) + (20 if guest_here else 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_living_room_motion', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 45)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Living Room Camera Person
        unique_id: siem_test_living_room_camera_person
        device_class: occupancy
        state: >-
          {% set per_hour = {'asleep': 0.1, 'morning': 2, 'away': 0.05, 'day': 3, 'evening': 6}.get(scene, 0) + (10 if guest_here else 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_living_room_camera_person', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 30)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Front Door
        unique_id: siem_test_front_door
        device_class: door
        state: >-
          {% set per_hour = {'asleep': 0.02, 'morning': 2, 'away': 0.1, 'day': 1, 'evening': 2}.get(scene, 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_front_door', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 30)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Living Room Window
        unique_id: siem_test_living_room_window
        device_class: window
        state: >-
          {% set per_hour = {'asleep': 0.02, 'morning': 0.2, 'away': 0.02, 'day': 0.3, 'evening': 0.2}.get(scene, 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_living_room_window', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 1200)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      # Test Backyard
      - name: Test Backyard Gate
        unique_id: siem_test_backyard_gate
        device_class: opening
        state: >-
          {% set per_hour = {'asleep': 0.02, 'morning': 0.3, 'away': 0.3, 'day': 0.8, 'evening': 0.5}.get(scene, 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_backyard_gate', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 20)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      - name: Test Backyard Camera Person
        unique_id: siem_test_backyard_camera_person
        device_class: occupancy
        state: >-
          {% set per_hour = {'asleep': 0.1, 'morning': 0.8, 'away': 1.0, 'day': 1.5, 'evening': 0.8}.get(scene, 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_backyard_camera_person', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 40)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
      # Whole house
      - name: Test Front Door CSI
        unique_id: siem_test_front_door_csi
        device_class: motion
        state: >-
          {% set per_hour = {'asleep': 0.05, 'morning': 3, 'away': 0.4, 'day': 1.5, 'evening': 3}.get(scene, 0) %}
          {% set on = is_state(this.entity_id, 'on') %}
          {{ is_state('input_boolean.test_front_door_csi', 'on')
             or (sim and ((on and (range(10000) | random) >= 10000 * tick / 30)
                          or (not on and (range(100000) | random) < 100000 * per_hour * rate * tick / 3600))) }}
    light:
      - name: Test Kitchen Light
        unique_id: siem_test_kitchen_light
        state: "{{ is_state('input_boolean.test_kitchen_light', 'on') }}"
        level: "{{ states('input_number.test_kitchen_light_brightness') | int(255) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_kitchen_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_kitchen_light
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.test_kitchen_light_brightness
            data:
              value: "{{ brightness }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_kitchen_light
      - name: Test Living Room Light
        unique_id: siem_test_living_room_light
        state: "{{ is_state('input_boolean.test_living_room_light', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_living_room_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_living_room_light
    lock:
      - name: Test Front Door Lock
        unique_id: siem_test_front_door_lock
        state: "{{ 'locked' if is_state('input_boolean.test_front_door_locked', 'on') else 'unlocked' }}"
        lock:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_front_door_locked
        unlock:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_front_door_locked

  # ---------------------------------------------------------------------------
  # Imitation of a Lock Code Manager "credential used" event entity for the
  # user Test Guest in code slot 3. Fires from the guest's helper buttons and
  # from the simulated afternoon visit (unlock on arrival, lock on leaving).
  # ---------------------------------------------------------------------------
  - triggers:
      - trigger: state
        entity_id:
          - input_button.test_guest_uses_pin
          - input_button.test_guest_locks_up
      - trigger: state
        entity_id: binary_sensor.test_sim_guest_visit
        to: "on"
      - trigger: state
        entity_id: binary_sensor.test_sim_guest_here
        from: "on"
        to: "off"
    event:
      - name: Test LCM Guest Credential Used
        unique_id: siem_test_lcm_guest_credential_used
        event_type: pin
        event_types: "{{ ['pin', 'fingerprint'] }}"
        attributes:
          code_slot: 3
          slot_field: credential_used
          name: Test Guest
          active: true
          operation: "{{ 'lock' if trigger.entity_id in ['input_button.test_guest_locks_up', 'binary_sensor.test_sim_guest_here'] else 'unlock' }}"
          credential_type: pin
          source: lock.test_front_door_lock
          target: lock.test_front_door_lock
          config_entry_title: Test Lock Code Manager

# A Bayesian sensor is "strong" for the SIEM whatever its device class. It
# watches the evidence mirror rather than the helper so its changes stay
# context free like the other mirrors.
binary_sensor:
  - platform: bayesian
    name: Test Kitchen Bayesian Occupancy
    unique_id: siem_test_kitchen_bayesian_occupancy
    device_class: motion
    prior: 0.2
    probability_threshold: 0.5
    observations:
      - platform: state
        entity_id: binary_sensor.test_kitchen_bayesian_evidence
        to_state: "on"
        prob_given_true: 0.95
        prob_given_false: 0.05

person:
  - name: Test Alice
    id: test_alice
    device_trackers:
      - device_tracker.test_alice_phone
  - name: Test Bob
    id: test_bob
    device_trackers:
      - device_tracker.test_bob_phone

# Loads the device_tracker integration so device_tracker.see exists even when
# nothing else provides a tracker.
device_tracker: []

script:
  # Scripted scenarios, played through the helpers so the mirrors report them
  # as physical events.
  test_sim_break_in:
    alias: Test Sim Break-In (scenario)
    icon: mdi:account-alert
    mode: single
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.test_backyard_gate
      - delay: "00:00:20"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.test_backyard_camera_person
      - delay: "00:00:15"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.test_backyard_gate
            - input_boolean.test_backyard_camera_person
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.test_kitchen_back_door
      - delay: "00:00:10"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.test_kitchen_motion
      - delay: "00:00:25"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.test_kitchen_light
      - delay: "00:00:20"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.test_kitchen_fridge_door
      - delay: "00:00:30"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.test_kitchen_back_door
            - input_boolean.test_kitchen_motion
            - input_boolean.test_kitchen_light
            - input_boolean.test_kitchen_fridge_door
  test_sim_delivery:
    alias: Test Sim Delivery (scenario)
    icon: mdi:package-variant
    mode: single
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.test_backyard_gate
      - delay: "00:00:10"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.test_backyard_gate
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.test_front_door_csi
      - delay: "00:00:30"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.test_front_door_csi
  # Z-Wave lock notifications, as zwave_js would fire them for the front door.
  test_front_door_manual_unlock:
    alias: Test Front Door Manual Unlock (Z-Wave event)
    icon: mdi:lock-open-variant
    sequence:
      - event: zwave_js_notification
        event_data:
          domain: zwave_js
          command_class_name: Notification
          command_class: 113
          type: 6
          label: Access Control
          event: 2
          event_label: Manual unlock operation
          parameters: {}
  test_front_door_keypad_unlock_guest:
    alias: Test Front Door Keypad Unlock Guest, slot 3 (Z-Wave event)
    icon: mdi:dialpad
    sequence:
      - event: zwave_js_notification
        event_data:
          domain: zwave_js
          command_class_name: Notification
          command_class: 113
          type: 6
          label: Access Control
          event: 6
          event_label: Keypad unlock operation
          parameters:
            userId: 3
  test_front_door_keypad_unlock_unknown:
    alias: Test Front Door Keypad Unlock Unknown, slot 9 (Z-Wave event)
    icon: mdi:dialpad
    sequence:
      - event: zwave_js_notification
        event_data:
          domain: zwave_js
          command_class_name: Notification
          command_class: 113
          type: 6
          label: Access Control
          event: 6
          event_label: Keypad unlock operation
          parameters:
            userId: 9
  test_front_door_keypad_lockout:
    alias: Test Front Door Keypad Lockout (Z-Wave event)
    icon: mdi:dialpad-off
    sequence:
      - event: zwave_js_notification
        event_data:
          domain: zwave_js
          command_class_name: Notification
          command_class: 113
          type: 6
          label: Access Control
          event: 16
          event_label: Keypad temporarily disabled
          parameters: {}

# Two automations: one shows SIEM's alerts, and one keeps three legacy device
# trackers in step with the "... home" helpers and the simulated scene. Alice
# and Bob are home in every scene except away, the second car only when its
# helper is on. device_tracker.see creates the trackers on first use
# (known_devices.yaml).
automation:
  # What a real setup does with its own automation: show every SIEM alert. Here
  # they become persistent notifications in the notification drawer.
  - id: siem_test_alerts
    alias: Test SIEM Alerts (helper)
    description: Shows every siem_notification event as a persistent notification.
    mode: queued
    max: 25
    triggers:
      - trigger: event
        event_type: siem_notification
    actions:
      - action: persistent_notification.create
        data:
          title: "{{ trigger.event.data.title }}"
          message: "{{ trigger.event.data.message }}"
  - id: siem_test_trackers
    alias: Test SIEM Trackers (helper)
    description: Mirrors the phone and car helpers and the simulated scene into device_tracker entities.
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.test_alice_phone_home
          - input_boolean.test_bob_phone_home
          - input_boolean.test_second_car_home
          - input_boolean.test_simulation
        to:
          - "on"
          - "off"
      - trigger: state
        entity_id: sensor.test_sim_scene
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - test_alice_phone
            - test_bob_phone
            - test_second_car
          sequence:
            - action: device_tracker.see
              data:
                dev_id: "{{ repeat.item }}"
                location_name: >-
                  {{ 'home' if is_state('input_boolean.' ~ repeat.item ~ '_home', 'on')
                     or (repeat.item != 'test_second_car' and is_state('input_boolean.test_simulation', 'on')
                         and states('sensor.test_sim_scene') in ['asleep', 'morning', 'day', 'evening'])
                     else 'not_home' }}
