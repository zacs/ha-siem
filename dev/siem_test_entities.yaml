          command_class_name: Notification
          command_class: 113
          type: 6
          label: Access Control
          event: 16
          event_label: Keypad temporarily disabled
          parameters: {}

# Keeps three legacy device trackers in step with the "... home" helpers.
# device_tracker.see creates the trackers on first use (known_devices.yaml).
automation:
  - id: siem_test_trackers
    alias: Test SIEM Trackers (helper)
    description: Mirrors the phone and car helpers into device_tracker entities.
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.test_alice_phone_home
          - input_boolean.test_bob_phone_home
          - input_boolean.test_guest_car_home
        to:
          - "on"
          - "off"
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - test_alice_phone
            - test_bob_phone
            - test_guest_car
          sequence:
            - action: device_tracker.see
              data:
                dev_id: "{{ repeat.item }}"
                location_name: "{{ 'home' if is_state('input_boolean.' ~ repeat.item ~ '_home', 'on') else 'not_home' }}"
