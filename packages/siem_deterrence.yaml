# =============================================================================
# SIEM Security: deterrence (package)
# =============================================================================
#
# Turns on every light in the incident's room when it reaches the deter tier,
# and every light in the house at the alarm tier. The room is the Home
# Assistant area SIEM reports with each alert, so the lights are whatever you
# have assigned to that area.
#
# A starting point: add a sound on the room's speakers, a siren or your own
# scripts where marked below. SIEM ignores the lights this turns on, the same
# as anything else an automation does.
#
# The same automation as the "SIEM deterrence" blueprint.
#
# INSTALL
#   1. Copy this file to <config>/packages/siem_deterrence.yaml and enable
#      packages in configuration.yaml if you have not already:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Restart Home Assistant, or reload automations.
#   Watching SIEM's alerts for a week or two before adding this is a good idea.
#   Turn the automation off from Settings > Automations to pause it.
# =============================================================================

automation:
  - id: siem_deterrence
    alias: SIEM deterrence
    description: Turns on the incident room's lights at the deter tier, and every light at the alarm tier.
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: siem_notification
        event_data:
          category: deter
      - trigger: event
        event_type: siem_notification
        event_data:
          category: alarm
    variables:
      # EDIT: how bright, in percent.
      brightness: 100
      category: "{{ trigger.event.data.category }}"
      area: "{{ trigger.event.data.incident.area_id if trigger.event.data.incident else none }}"
      room_lights: "{{ area_entities(area) | select('match', 'light[.]') | list if area else [] }}"
    actions:
      - if:
          - condition: template
            value_template: "{{ room_lights | count > 0 }}"
        then:
          - action: light.turn_on
            target:
              entity_id: "{{ room_lights }}"
            data:
              brightness_pct: "{{ brightness }}"
      # EDIT: anything else at the deter tier, such as a sound on a speaker:
      # - if:
      #     - condition: template
      #       value_template: "{{ category == 'deter' }}"
      #   then:
      #     - action: media_player.play_media
      #       target:
      #         entity_id: media_player.kitchen
      #       data:
      #         media_content_id: media-source://media_source/local/dog_bark.mp3
      #         media_content_type: music
      - if:
          - condition: template
            value_template: "{{ category == 'alarm' }}"
        then:
          # EDIT: the lights to turn on at the alarm tier; "all" is every light.
          - action: light.turn_on
            target:
              entity_id: all
            data:
              brightness_pct: "{{ brightness }}"
          # EDIT: anything else at the alarm tier, such as a siren:
          # - action: siren.turn_on
          #   target:
          #     entity_id: siren.hall
