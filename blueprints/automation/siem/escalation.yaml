blueprint:
  name: SIEM escalation
  description: >-
    When nobody answers an incident, tells more people. An answer is any label
    on the incident (False alarm, That's me, Real, Guest), from a phone, a chat
    button or the SIEM device page. If an incident reaches the tiers you pick
    and nobody has labelled it within the wait, the phones below get it too,
    with the same buttons, and once someone answers, a line saying who. An alarm
    doesn't wait. Optionally, if it is still unanswered after another wait, run
    actions of your own: a siren, a script that calls someone.
  domain: automation
  author: zacs
  source_url: https://github.com/zacs/ha-siem/blob/main/blueprints/automation/siem/escalation.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    escalate_to:
      name: Escalate to
      description: Phones with the Home Assistant companion app, told when nobody answers.
      selector:
        device:
          integration: mobile_app
          multiple: true
    wait:
      name: Wait
      description: How long to wait for an answer before escalating.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    tiers:
      name: Tiers
      description: Incidents that reach these tiers are escalated when unanswered.
      default: [verify, deter, alarm]
      selector:
        select:
          multiple: true
          options:
            - label: Verify
              value: verify
            - label: Deter
              value: deter
            - label: Alarm
              value: alarm
    still_unanswered:
      name: Still unanswered
      description: Actions to run if nobody answers within the wait after the escalation either.
      default: []
      selector:
        action: {}

mode: parallel
max: 20

# The first time an incident reaches a tier.
triggers:
  - trigger: event
    event_type: siem_incident
    event_data:
      kind: tier_changed
      previous_tier: none

variables:
  escalate_to: !input escalate_to
  wait_minutes: !input wait
  tiers: !input tiers
  still_unanswered: !input still_unanswered
  incident: "{{ trigger.event.data }}"
  incident_id: "{{ incident.incident_id }}"
  services: >-
    {%- set ns = namespace(list=[]) %}
    {%- for phone in escalate_to %}
    {%- set ns.list = ns.list + ['notify.' ~ ('mobile_app_' ~ device_attr(phone, 'name')) | slugify] %}
    {%- endfor %}
    {{ ns.list }}
  label_names:
    false_alarm: False alarm
    thats_me: That's me
    real: Real
    guest: Guest

conditions:
  - condition: template
    value_template: "{{ incident.tier in tiers }}"

actions:
  # An alarm doesn't wait. A condition at this level ends the run, so an answer stops everything below.
  - wait_for_trigger:
      - trigger: event
        event_type: siem_incident
        event_data:
          kind: labelled
          incident_id: "{{ incident_id }}"
        id: answered
      - trigger: event
        event_type: siem_incident
        event_data:
          kind: tier_changed
          tier: alarm
          incident_id: "{{ incident_id }}"
        id: alarm
    timeout: "{{ 0 if incident.tier == 'alarm' else (wait_minutes | float * 60) | int }}"
    continue_on_timeout: true
  - condition: template
    value_template: "{{ not wait.trigger or wait.trigger.id != 'answered' }}"
  - variables:
      latest: "{{ wait.trigger.event.data if wait.trigger else incident }}"
      steps: >-
        {{ latest.timeline[:5] | map(attribute='name') | select | unique | join(', ') }}
  - repeat:
      for_each: "{{ services }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            title: "SIEM {{ latest.tier }}: {{ latest.room or 'House' }}, no answer"
            message: >-
              Nobody has labelled this {{ latest.tier }} incident yet.{{ ' ' ~ steps ~ '.' if steps else '' }}
              House {{ latest.house_mode }}.
            data:
              tag: "siem-{{ incident_id }}"
              group: siem
              ttl: 0
              priority: high
              push:
                interruption-level: "{{ 'time-sensitive' if latest.tier == 'alarm' else 'active' }}"
              actions:
                - action: "SIEM_LABEL_FALSE_ALARM|{{ incident_id }}"
                  title: False alarm
                - action: "SIEM_LABEL_THATS_ME|{{ incident_id }}"
                  title: That's me
                - action: "SIEM_LABEL_REAL|{{ incident_id }}"
                  title: Real
                - action: "SIEM_LABEL_GUEST|{{ incident_id }}"
                  title: Guest
  # Wait for the answer: within the wait when there is something left to do, or up to an hour to say who answered.
  - wait_for_trigger:
      - trigger: event
        event_type: siem_incident
        event_data:
          kind: labelled
          incident_id: "{{ incident_id }}"
    timeout: "{{ (wait_minutes | float * 60) | int if still_unanswered | count > 0 else 3600 }}"
    continue_on_timeout: true
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger is not none }}"
        sequence:
          # Same tag as the escalation: the phone replaces it, buttons and all.
          - variables:
              e: "{{ wait.trigger.event.data }}"
              name: "{{ label_names.get(e.label, e.label) }}"
          - repeat:
              for_each: "{{ services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "SIEM: {{ name }}"
                    message: >-
                      {{ e.tier | capitalize }} incident{{ ' in ' ~ e.room if e.room else '' }} labelled {{ name }}{{ ' by ' ~ e.by if e.by else '' }}.
                    data:
                      tag: "siem-{{ incident_id }}"
                      group: siem
      - conditions:
          - condition: template
            value_template: "{{ still_unanswered | count > 0 }}"
        sequence: !input still_unanswered
