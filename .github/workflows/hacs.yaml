name: HACS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # topics: a GitHub setting, not repository content. Add topics
          # (home-assistant, hacs, homeassistant-integration, siem) in the
          # repository settings, then drop it from this list.
          # hacsjson, integration_manifest: HACS downloads both files from
          # raw.githubusercontent.com without a token, which 404s while the
          # repository is private. Drop them once the repository is public.
          ignore: topics hacsjson integration_manifest
