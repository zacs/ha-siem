[project]
name = "ha-siem"
version = "0.2.0"
description = "A SIEM-style risk engine for a house, as a Home Assistant custom component."
readme = "README.md"
requires-python = ">=3.13"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "PLC", "PLE", "PLW", "RUF", "SIM", "UP", "W"]
ignore = ["D105", "D107", "D203", "D212", "D213", "E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.siem"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
